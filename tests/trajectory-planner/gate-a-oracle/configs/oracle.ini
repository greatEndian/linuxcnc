# Gate A oracle: instrumented XYZ sim for independent commanded-motion capture.
# Derived from configs/sim/axis/axis_mm_scurve.ini.  PLANNER_TYPE is rewritten
# by run-capture.sh; do not edit it here expecting it to survive a run.

[EMC]
VERSION = 1.1
MACHINE = gate-a-oracle
DEBUG = 0

[DISPLAY]
DISPLAY = ./driver.py
CYCLE_TIME = 0.200
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
PROGRAM_PREFIX = ./

[EMCMOT]
# BASE_PERIOD is 100 us so that the servo thread period is an exact
# multiple of it.  HAL rounds the servo period up to a multiple of the base
# period, and with the stock 150 us the 1 ms request becomes 1.05 ms, which
# silently rescales every time measurement (and, per RESULTS, the arc feed).
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
BASE_PERIOD = 100000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALFILE = oracle.hal

[TRAJ]
PLANNER_TYPE = 1
MAX_LINEAR_JERK = 10000.0
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
CYCLE_TIME = 0.010
DEFAULT_LINEAR_VELOCITY = 100.0
MAX_LINEAR_VELOCITY = 300.0
DEFAULT_LINEAR_ACCELERATION = 500.0
MAX_LINEAR_ACCELERATION = 1000.0
NO_FORCE_HOMING = 1
ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 0
ARC_BLEND_OPTIMIZATION_DEPTH = 50
ARC_BLEND_RAMP_FREQ = 20
ARC_BLEND_GAP_CYCLES = 4

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[RS274NGC]
PARAMETER_FILE = oracle.var

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 800.0
MAX_JERK = 10000.0
HOME_SEQUENCE = 0

[AXIS_X]
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0

[AXIS_Y]
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0

[AXIS_Z]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 800.0
MAX_JERK = 10000.0
