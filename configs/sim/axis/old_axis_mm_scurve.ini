# ========================================================
# S-CURVE MOTION PLANNING CONFIGURATION EXAMPLE
# ========================================================
#
# This file demonstrates how to configure S-curve (jerk-limited)
# motion planning in LinuxCNC. S-curve planning produces smoother
# acceleration profiles that can reduce machine vibration and
# improve surface finish.
#
# IMPORTANT: S-curve planning is OPTIONAL.
# Traditional trapezoidal acceleration is used when:
#   - PLANNER_TYPE = 0, OR
#   - MAX_LINEAR_JERK = 0
#
# NOTE: If MAX_LINEAR_JERK is not specified, it defaults to 1e9 (1 billion),
# which effectively disables jerk limiting while still using S-curve calculations.
# This produces motion similar to trapezoidal but not identical.
#
# ========================================================
[EMC]
VERSION = 1.1
MACHINE = scurve_example
DEBUG = 0

[FILTER]
#PROGRAM_EXTENSION = .ngc Spline Compressor Filter
#ngc = python3 /home/user/linuxcnc-dev/tests/trajectory-planner/spline_compressor_wrapper.py

[DISPLAY]
JOG_AXES = XYZ
GEOMETRY = XYZ
DISPLAY = axis
CYCLE_TIME = 0.200
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.0
PROGRAM_PREFIX = M-Codes
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
EDITOR = gedit

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT = 0.010
BASE_PERIOD =   150000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = old_axis_mm_scurve.hal

[TRAJ]
# --------------------------------------------------------
# S-curve Planner Configuration
# --------------------------------------------------------

# PLANNER_TYPE: Select the acceleration profile shape
#   0 = Trapezoidal (traditional - constant acceleration)
#   1 = S-curve (smoother - limited jerk/derivative of acceleration)
# Default: 0 (trapezoidal)
#
# NOTE: This parameter can be changed at RUNTIME via HAL pin:
#       ini.traj_planner_type (allows switching on-the-fly)
PLANNER_TYPE = 1

# SCURVE_FOLLOWER: experimental S-curve execution mode (only with PLANNER_TYPE=1)
#   0 = per-segment Ruckig replan (default, shipping path)
#   1 = jerk-limited velocity-profile follower (no per-segment replan; cannot
#       ring on dense micro-segment cusps). Pause/abort/feed-hold/sync/reverse
#       always use the Ruckig path regardless of this setting.
# Wired to the motmod scurve_follower param in the HAL (loadrt ...
# scurve_follower=[TRAJ]SCURVE_FOLLOWER). Toggle here, then restart LinuxCNC.
SCURVE_FOLLOWER = 1

# COMPRESSOR_ENABLE: Spline compression for micro-segment G-code
#   0 = Disabled (pass through uncompressed, zero compression)
#   1 = perpbisector + artifact suppression (RECOMMENDED - safe compression)
#   2 = liscio C99 (fails on mixed 2D/3D, not recommended)
# Default: 0 (pass-through, no compression)
#
# v1 includes intelligent artifact suppression:
#   - Detects spurious orbital arcs (large I/J offsets)
#   - Automatically suppresses them, outputs original G1 moves
#   - Keeps legitimate arc compression for real curves
#   - Results: 20-40% compression on valid arcs, ZERO spurious artifacts
#
# SAFE: Compressor intelligently detects and removes problematic arcs.
# Only keep legitimate compression that represents actual part geometry.
#
# The compressor converts micro-segment CAM output (many short G1 lines) into
# G2/G3 arcs for 20-40% file size reduction while suppressing artifacts.
COMPRESSOR_ENABLE = 0

# MAX_LINEAR_JERK: Maximum rate of change of acceleration
# Units: machine-units/second^3 (e.g., mm/s^3 or inch/s^3)
#
# Setting this to 0 disables S-curve planning regardless of PLANNER_TYPE
# If not specified, defaults to 1e9 (effectively no jerk limiting)
# Maximum allowed value is 1e9 (values above are automatically clamped)
#
# Recommended starting values (adjust based on your machine):
#   - Light/rigid machines: 1000-10000
#   - Heavy/flexible machines: 100-1000
#   - Very rigid machines: 10000-100000
#
# Higher values = sharper acceleration changes (closer to trapezoidal)
# Lower values = smoother acceleration changes (more gradual)
#
# NOTE: This parameter can be changed at RUNTIME via HAL pin:
#       ini.traj_max_jerk (allows tuning on-the-fly)
MAX_LINEAR_JERK = 10000.0

# TANGENT_ANGLE_TOLERANCE: Soft tangent blending threshold (degrees)
# Units: degrees
# Default: 3.0
#
# When the angle between two successive segments is less than this threshold,
# the trajectory planner applies soft tangent blending at the corner to allow
# continuous velocity through the transition without sharp deceleration.
# Runtime-tunable via HAL pin: motion.tangent-angle-tolerance
# Range: 0.1 to 45.0 (degrees)
#   0.1 = only exact or near-exact tangents are blended (strict)
#   3.0 = moderate: 3-degree corners are blended (recommended)
#   10.0 = lenient: wide corners are blended (may mask geometry issues)
TANGENT_ANGLE_TOLERANCE = 3.0

# SHARP_CORNER_ANGLE: Threshold for detecting very sharp corners (degrees)
# Units: degrees
# Default: 2.0
#
# Corners sharper (smaller angle) than this are treated as sharp corners requiring
# full deceleration to safety velocity. Used in trajectory optimization to decide
# whether corner velocity blending is feasible.
# Runtime-tunable via HAL pin: motion.sharp-corner-angle
# Range: 0.1 to 20.0 (degrees)
#   0.5 = only extremely sharp corners (< 0.5°) trigger safety deceleration
#   2.0 = typical: sharp corners decelerate to safety velocity (recommended)
#   5.0 = conservative: even moderate corners trigger deceleration
SHARP_CORNER_ANGLE = 3.0

# CONVERGENCE_TOLERANCE: Optimization loop early convergence threshold
# Units: machine-units/second (velocity change magnitude)
# Default: 1e-6 (0.000001)
#
# During trajectory optimization, when successive iterations of velocity/acceleration
# adjustment change by less than this threshold, the optimizer declares convergence
# and stops iterating (early exit). Smaller values = more iterations, higher precision.
# Runtime-tunable via HAL pin: motion.convergence-tolerance
# Range: 1e-8 to 1e-3 (practical range)
#   1e-8 = very strict convergence (many iterations, slower)
#   1e-6 = balanced (recommended for production)
#   1e-4 = aggressive early exit (fewer iterations, faster but less precise)
CONVERGENCE_TOLERANCE = 1e-6

# --------------------------------------------------------
# Standard TRAJ parameters (still required with S-curve)
# --------------------------------------------------------
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
CYCLE_TIME = 0.010
DEFAULT_LINEAR_VELOCITY = 100.0
MAX_LINEAR_VELOCITY = 300.0
DEFAULT_LINEAR_ACCELERATION = 1000.0
MAX_LINEAR_ACCELERATION = 1000.0
# to be able to run gcodes and MDI without homing
NO_FORCE_HOMING = 1

ARC_BLEND_ENABLE = 1
ARC_BLEND_FALLBACK_ENABLE = 1
ARC_BLEND_TANGENT_KINK = 0.1
ARC_BLEND_OPTIMIZATION_DEPTH = 250
ARC_BLEND_RAMP_FREQ = 250
ARC_BLEND_GAP_CYCLES = 64
TARGET_BUFFER_TIME_MS = 300
TC_QUEUE_SIZE = 250

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100


[KINS]
# 5axiskins misnomer 1 more joint for W
KINEMATICS = trivkins
JOINTS = 3

[RS274NGC]
# File containing interpreter variables
PARAMETER_FILE = scurve_example.var

# ========================================================
# JOINT CONFIGURATION
# ========================================================
# Each joint can have its own jerk limit. If not specified,
# the joint uses the axis/trajectory jerk limits.

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
HOME_SEQUENCE = 0

# MAX_JERK: Maximum jerk for this joint
# Units: machine-units/second^3
# Default: 0.0 (disabled, uses trapezoidal)
#
# This should match or be higher than the trajectory jerk
# to avoid limiting coordinated motion.
MAX_JERK = 10000.0

#MIN_LIMIT = -200.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 200.0 #disabled to give more space for testing g-codes

# ========================================================
# HOMING CONFIGURATION FOR S-CURVE
# ========================================================
# WARNING: When using S-curve motion (PLANNER_TYPE=1), you MUST set
# HOME_SEARCH_VEL and HOME_LATCH_VEL significantly SLOWER than you
# would with trapezoidal motion planning.
#
# S-curve motion requires MORE DISTANCE to decelerate due to the
# jerk-limited acceleration profile. If homing velocities are too
# high, the axis may overshoot and hit hard limits or sensor limits.
#
# RECOMMENDED: Start with 50% or less of the velocities you would
# use with trapezoidal planning, then increase cautiously.
#
# Example homing configuration (adjust for your machine):
#HOME_SEARCH_VEL = 5.0       # Velocity for initial limit switch search
#HOME_LATCH_VEL = 1.0        # Velocity for precise homing (slower)
#HOME_OFFSET = 0.0           # Distance from switch to home position
#HOME_USE_INDEX = NO         # Use encoder index pulse for homing
#HOME_IGNORE_LIMITS = NO     # Ignore limit switches during homing move
# ========================================================

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0
#MIN_LIMIT = -200.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 200.0 #disabled to give more space for testing g-codes
HOME_SEQUENCE = 0

# WARNING: S-curve homing requires SLOWER velocities than trapezoidal!
# See JOINT_0 for detailed homing configuration examples.
#HOME_SEARCH_VEL = 5.0
#HOME_LATCH_VEL = 1.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0
#MIN_LIMIT = -100.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 100.0 #disabled to give more space for testing g-codes
HOME_SEQUENCE = 0

# WARNING: S-curve homing requires SLOWER velocities than trapezoidal!
# See JOINT_0 for detailed homing configuration examples.
#HOME_SEARCH_VEL = 4.0
#HOME_LATCH_VEL = 0.8

# ========================================================
# AXIS CONFIGURATION
# ========================================================

[AXIS_X]
#MIN_LIMIT = -200.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 200.0 #disabled to give more space for testing g-codes
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0

# MAX_JERK: Maximum jerk for coordinated motion on this axis
# Units: machine-units/second^3
# Default: 0.0 (disabled)
MAX_JERK = 10000.0

[AXIS_Y]
#MIN_LIMIT = -200.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 200.0 #disabled to give more space for testing g-codes
MAX_VELOCITY = 300.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0

[AXIS_Z]
#MIN_LIMIT = -100.0 #disabled to give more space for testing g-codes
#MAX_LIMIT = 100.0 #disabled to give more space for testing g-codes
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 1000.0
MAX_JERK = 10000.0

# ========================================================
# TUNING GUIDELINES
# ========================================================
#
# 1. START WITH TRAPEZOIDAL (PLANNER_TYPE=0)
#    - Verify your machine works correctly with traditional planning
#    - Note any vibration or resonance issues
#
# 2. ENABLE S-CURVE WITH CONSERVATIVE VALUES
#    - Set PLANNER_TYPE = 1
#    - Start with low MAX_LINEAR_JERK (e.g., 100-500)
#    - Jerk should typically be 10-100x your acceleration value
#
# 3. GRADUALLY INCREASE JERK
#    - Increase MAX_LINEAR_JERK in steps of 2-3x
#    - Test with simple moves and observe:
#      * Motor current/torque
#      * Vibration levels
#      * Following errors
#      * Surface finish quality
#
# 4. FIND OPTIMAL VALUE
#    - Too low: Motion becomes sluggish, cycle time increases
#    - Too high: Approaches trapezoidal behavior, loses smoothness
#    - Optimal: Smooth motion without excessive deceleration
#
# 5. VERIFY COORDINATED MOTION
#    - Test circular interpolation (G2/G3)
#    - Check complex 3D toolpaths
#    - Verify axis jerk limits don't constrain trajectory jerk
#
# ========================================================
# TROUBLESHOOTING
# ========================================================
#
# SYMPTOM: No difference between PLANNER_TYPE=0 and PLANNER_TYPE=1
# SOLUTION: Verify MAX_LINEAR_JERK > 0 and MAX_JERK > 0 for all joints/axes
#
# SYMPTOM: Motion is too slow with S-curve enabled
# SOLUTION: Increase MAX_LINEAR_JERK value
#
# SYMPTOM: Following errors increase with S-curve
# SOLUTION: Decrease MAX_LINEAR_JERK or increase PID I-gain
#
# SYMPTOM: Vibration/resonance at certain speeds
# SOLUTION: Adjust MAX_LINEAR_JERK to avoid resonant frequencies
#          Consider using different jerk values for different axes
#
# ========================================================
